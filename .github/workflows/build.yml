name: Build kontol APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Debug - List Files
        run: |
          echo "=== ROOT ===" && ls -la
          echo "=== Find generate_icons.py ===" && find . -name "generate_icons.py"
          echo "=== Find gradlew ===" && find . -name "gradlew"

      - name: Generate App Icons
        run: |
          SCRIPT_DIR=$(find . -name "generate_icons.py" -exec dirname {} \; | head -1)
          echo "Running from: $SCRIPT_DIR"
          cd "$SCRIPT_DIR"
          python3 generate_icons.py

      - name: Setup Gradle Wrapper
        run: |
          ANDROID_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -1)
          echo "Android dir: $ANDROID_DIR"
          mkdir -p "$ANDROID_DIR/gradle/wrapper"
          
          curl -L -o /tmp/gradle-8.4-bin.zip "https://services.gradle.org/distributions/gradle-8.4-bin.zip" || \
          echo "Download failed, gradle akan download otomatis"
          
          if [ -f /tmp/gradle-8.4-bin.zip ]; then
            JAR_PATH=$(unzip -l /tmp/gradle-8.4-bin.zip | grep "gradle-wrapper.jar" | awk '{print $NF}')
            echo "Found JAR at: $JAR_PATH"
            if [ -n "$JAR_PATH" ]; then
              unzip -p /tmp/gradle-8.4-bin.zip "$JAR_PATH" > "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar"
            fi
            rm /tmp/gradle-8.4-bin.zip
          fi
          
          {
            echo "distributionBase=GRADLE_USER_HOME"
            echo "distributionPath=wrapper/dists"
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip"
            echo "networkTimeout=10000"
            echo "zipStoreBase=GRADLE_USER_HOME"
            echo "zipStorePath=wrapper/dists"
          } > "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Setup gradle.properties
        run: |
          ANDROID_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -1)
          echo "android.suppressUnsupportedCompileSdk=35" >> "$ANDROID_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> "$ANDROID_DIR/gradle.properties"

      - name: Clean Gradle Cache
        run: |
          ANDROID_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -1)
          cd "$ANDROID_DIR"
          ./gradlew clean --no-daemon || true
          rm -rf .gradle build

      - name: Build Release APK
        run: |
          ANDROID_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -1)
          cd "$ANDROID_DIR"
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find . -path "*/apk/release/*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
